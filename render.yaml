# ============================================================
# ARCHIVO: render.yaml
# RESPONSABILIDAD: Definir los servicios a desplegar en Render.
# 1) backend: Web Service (Node/Express)
# (El frontend se crea manualmente como Static Site, ya que
#  Render Blueprint no soporta el tipo "static")
# Las variables de entorno sensibles se configuran desde el
# dashboard de Render, no en este archivo.
# ============================================================

services:
  # ==================== BACKEND (API) ====================
  - type: web
    name: urban-cuts-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        value: aws-0-us-east-2.pooler.supabase.com
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.zbpufanadbxtztwwzpfb
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: barberia
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CORS_ORIGIN
        sync: false
